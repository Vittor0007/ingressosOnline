server {
     listen 80;
     root /var/www/html/public;
     index index.php;

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass php:9000;
    }
    
    location ~* \.php$ {
        return 404;
    }
     location / {
          try_files $uri /index.php?$query_string;
      }
}

