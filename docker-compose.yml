services:
  php:
    build:
      context: .
      args:
        APP_VERSAO: dev
    volumes:
      - .:/var/www/html
  nginx:
    image: nginx:stable-alpine  
    ports:
     - "8081:80"
    volumes:
     - ./public:/var/html/public:ro
     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php